spring.application.name=crypto-wallet

# Server
server.port=8080

# Database
spring.datasource.url=jdbc:mysql://localhost:3306/crypto_wallet?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Session / Cookie
# Session timeout 30 minutes
server.servlet.session.timeout=30m
# HttpOnly + Secure cookie flags
server.servlet.session.cookie.http-only=true
# set to true in production (HTTPS)
server.servlet.session.cookie.secure=false
server.servlet.session.cookie.same-site=Lax
server.servlet.session.cookie.name=NEXUS_SESSION

# File Upload
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=30MB

# KYC upload directory (relative to working directory)
app.kyc.upload-dir=uploads/kyc

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# Logging
logging.level.com.crypto=DEBUG
logging.level.org.springframework.security=INFO

# In production, inject via environment variable MASTER_KEY_SECRET.
# Fallback to the specified key.
master.key.secret=${MASTER_KEY_SECRET}